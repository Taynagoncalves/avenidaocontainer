<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Avenidão Container | Peça agora</title>
  <meta name="description" content="Avenidão Container em Cascavel - PR. Peça pelo site, iFood ou WhatsApp. Delivery e retirada.">
  <meta name="theme-color" content="#ff5b00">
  <meta name="color-scheme" content="light dark">

  <!-- Open Graph (WhatsApp, Facebook, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://avenidaocontainer.onrender.com/">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Avenidão Container">
  <meta property="og:title" content="Avenidão Container | Peça agora">
  <meta property="og:description" content="Avenidão Container em Cascavel - PR. Peça pelo site, iFood ou WhatsApp. Delivery e retirada.">
  <meta property="og:image" content="https://avenidaocontainer.onrender.com/logo.jpg">
  <meta property="og:image:alt" content="Logo do Avenidão Container">
  <meta name="twitter:card" content="summary">

  <!-- EDITAR: favicon usando o logo -->
  <link rel="icon" href="logo.jpg">
  <link rel="apple-touch-icon" href="logo.jpg">

  <style>
    :root {
      --brand: #ff5b00;
      --brand-press: #e65200;
      --ifood: #ea1d2c;
      --whatsapp: #25d366;
      --whatsapp-text: #06331a;

      --bg: #f7f6f4;
      --surface: #ffffff;
      --text: #1c1b1a;
      --muted: #6b6762;
      --border: #e7e4e0;
      --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 4px 14px rgba(0, 0, 0, .06);

      --radius: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121110;
        --surface: #1d1c1a;
        --text: #f3f1ee;
        --muted: #a39e98;
        --border: #2e2c29;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: max(32px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ---------- Cabeçalho ---------- */
    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      position: relative;
      width: 104px;
      height: 104px;
      margin: 0 auto 14px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--brand);
      box-shadow: 0 0 0 4px var(--surface), 0 0 0 6px var(--brand), var(--shadow);
      display: grid;
      place-items: center;
    }

    .logo-fallback {
      color: #fff;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -.02em;
    }

    /* Logo (1280x853 com fundo preto): ampliado e posicionado para centralizar a arte no círculo */
    .logo:has(img) { background: #000; }

    .logo img {
      position: absolute;
      left: -28px;
      top: 9px;
      width: 160px;
      height: auto;
      max-width: none;
    }

    .name {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }


    /* ---------- Botões ---------- */
    .links {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      padding: 14px 56px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: transform .12s ease, filter .12s ease, background-color .12s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn:active { transform: scale(.97); }

    .btn:focus-visible {
      outline: 3px solid var(--brand);
      outline-offset: 3px;
    }

    .btn svg {
      position: absolute;
      left: 18px;
      top: 50%;
      width: 24px;
      height: 24px;
      transform: translateY(-50%);
      flex-shrink: 0;
    }

    @media (hover: hover) {
      .btn:hover { filter: brightness(1.05); }
    }

    /* Botão principal */
    .btn-primary {
      min-height: 68px;
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      background: var(--brand);
      box-shadow: 0 6px 20px rgba(255, 91, 0, .35);
    }
    .btn-primary svg { width: 26px; height: 26px; }
    .btn-primary:active { background: var(--brand-press); }

    .btn-ifood {
      color: #fff;
      background: var(--ifood);
    }

    .btn-whatsapp {
      color: var(--whatsapp-text);
      background: var(--whatsapp);
    }

    .btn-map {
      color: var(--text);
      background: var(--surface);
      border-color: var(--border);
    }
    .btn-map svg { color: var(--brand); }

    .address {
      margin: 8px 4px 0;
      text-align: center;
      font-size: .8rem;
      color: var(--muted);
    }

    /* ---------- Rodapé ---------- */
    .footer {
      margin-top: auto;
      padding-top: 32px;
      text-align: center;
      font-size: .85rem;
    }

    .footer a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      color: var(--muted);
      text-decoration: none;
      border-radius: 999px;
    }

    .footer a:hover { color: var(--text); }
    .footer a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .footer svg { width: 16px; height: 16px; }

    /* ---------- Movimento reduzido ---------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
  <main class="page">

    <header class="header">
      <div class="logo">
        <span class="logo-fallback" aria-hidden="true">AC</span>
        <!-- EDITAR: URL da imagem do logo -->
        <img src="logo.jpg" alt="Logo do Avenidão Container" width="1280" height="853" onerror="this.remove()">
      </div>
      <h1 class="name">Avenidão Container</h1>
    </header>

    <ul class="links">
      <li>
        <a class="btn btn-primary" href="https://avenidaocontainer.centralpedidosonline.com.br/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
            <path d="M3 6h18"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          Fazer pedido pelo site
        </a>
      </li>

      <li>
        <a class="btn btn-ifood" href="https://www.ifood.com.br/delivery/cascavel-pr/avenidao-container-floresta/92b23a23-96fb-44d3-a732-616bd83482e5" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="0" y="3" width="24" height="18" rx="5" fill="#fff"/>
            <text x="12" y="15.6" text-anchor="middle" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="8.2" font-weight="900" font-style="italic" fill="#ea1d2c" letter-spacing="-.3">iFood</text>
          </svg>
          Pedir pelo iFood
        </a>
      </li>

      <li>
        <a class="btn btn-whatsapp" href="https://wa.me/5545998269678?text=Ol%C3%A1!%20Vim%20pelo%20Instagram" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2.5a9.5 9.5 0 0 0-8.2 14.3L2.5 21.5l4.8-1.3A9.5 9.5 0 1 0 12 2.5Z" stroke-width="1.9"/>
            <path transform="translate(12 12) scale(.42) translate(-12 -12)" stroke-width="4.2" d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92Z"/>
          </svg>
          Falar no WhatsApp
        </a>
      </li>

      <li>
        <a class="btn btn-map" href="https://www.google.com/maps/search/?api=1&amp;query=Avenid%C3%A3o%20Container%2C%20Av.%20Papagaios%2C%202191%20-%20Floresta%2C%20Cascavel%20-%20PR" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          Ver localização
        </a>
        <p class="address">Av. Papagaios, 2191 - Floresta, Cascavel - PR, 85814-530</p>
      </li>
    </ul>


    <footer class="footer">
      <!-- EDITAR: @ do Instagram -->
      <a href="https://www.instagram.com/avenidaocontainer/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <path d="M17.5 6.5h.01"/>
        </svg>
        @avenidaocontainer
      </a>
    </footer>

  </main>

</body>
</html>
